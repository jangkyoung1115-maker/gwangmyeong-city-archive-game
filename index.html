<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>광명시 시간의 지층 아카이브</title>
    <!-- Pretendard 폰트 & FontAwesome 아이콘 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- EXIF 날짜/GPS 추출 라이브러리 -->
    <script src="https://cdn.jsdelivr.net/npm/exif-js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; }
        html, body { width: 100%; height: 100%; background-color: #0f1115; color: #f3f4f6; overflow: hidden; }

        header {
            height: 50px; background: #181b22; border-bottom: 1px solid #2d323e;
            display: flex; align-items: center; justify-content: space-between; padding: 0 16px; z-index: 100;
        }
        .logo { font-size: 1rem; font-weight: 800; color: #60a5fa; display: flex; align-items: center; gap: 6px; }
        .logo i { color: #f59e0b; }

        #main-container { display: flex; flex-direction: column; height: calc(100vh - 50px); width: 100%; }

        /* 상단 지도 & 로드뷰 영역 */
        #view-section {
            height: 40vh; min-height: 230px; width: 100%; position: relative; background: #181b22;
            border-bottom: 2px solid #2d323e;
        }
        #map, #roadview-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
        #roadview-container { display: none; }

        .view-toggle {
            position: absolute; top: 12px; right: 12px; z-index: 20;
            background: rgba(24, 27, 34, 0.9); border: 1px solid #3b82f6; border-radius: 20px;
            padding: 4px; display: flex; gap: 4px;
        }
        .toggle-btn {
            background: none; border: none; color: #9ca3af; padding: 6px 12px;
            font-size: 0.75rem; font-weight: 700; border-radius: 16px; cursor: pointer;
        }
        .toggle-btn.active { background: #2563eb; color: #fff; }

        /* 하단 지층 아카이브 패널 */
        #strata-panel { flex: 1; background: #14171d; display: flex; flex-direction: column; padding: 16px; overflow-y: auto; }
        
        .panel-header { margin-bottom: 10px; }
        .panel-header h2 { font-size: 1.05rem; color: #fff; margin-bottom: 2px; display: flex; align-items: center; gap: 6px; }
        .panel-header p { font-size: 0.78rem; color: #8b949e; line-height: 1.35; }

        /* 동별 필터 버튼 스크롤 */
        .category-filter {
            display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 10px;
            scrollbar-width: none;
        }
        .category-filter::-webkit-scrollbar { display: none; }
        .cat-btn {
            background: #1c212b; border: 1px solid #2d323e; color: #9ca3af;
            padding: 5px 12px; border-radius: 14px; font-size: 0.75rem; font-weight: 600;
            white-space: nowrap; cursor: pointer; transition: all 0.2s;
        }
        .cat-btn.active { background: #2563eb; color: #fff; border-color: #3b82f6; }

        .area-badge {
            display: inline-flex; align-items: center; gap: 6px; background: rgba(37, 99, 235, 0.2);
            color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.4); padding: 5px 12px;
            border-radius: 14px; font-size: 0.78rem; font-weight: 700; margin-bottom: 12px; width: fit-content;
        }

        .upload-btn {
            background: #2563eb; color: white; padding: 11px; border: none; border-radius: 8px;
            font-weight: 700; font-size: 0.85rem; cursor: pointer; margin-bottom: 14px;
            display: flex; align-items: center; justify-content: center; gap: 6px; transition: background 0.2s;
        }
        .upload-btn:hover { background: #1d4ed8; }

        .strata-timeline { display: flex; flex-direction: column; gap: 14px; position: relative; }
        .strata-timeline::before {
            content: ''; position: absolute; left: 13px; top: 8px; bottom: 8px;
            width: 2px; background: #2d323e; z-index: 1;
        }

        /* 연도별 지층 카드 */
        .strata-card {
            position: relative; z-index: 2; background: #1c212b; border: 1px solid #2d323e;
            border-radius: 10px; padding: 12px 12px 12px 34px; transition: all 0.2s ease-in-out;
        }
        .strata-card:hover { border-color: #3b82f6; background: #232a37; }

        .strata-node {
            position: absolute; left: 8px; top: 16px; width: 10px; height: 10px;
            border-radius: 50%; background: #3b82f6; border: 2px solid #14171d; z-index: 3;
        }

        .strata-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
        .strata-year { font-size: 0.92rem; font-weight: 800; color: #60a5fa; display: flex; align-items: center; gap: 6px; }
        
        .dong-tag {
            font-size: 0.7rem; padding: 2px 8px; border-radius: 10px; font-weight: 700;
            background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.4);
            cursor: pointer;
        }

        .strata-date { font-size: 0.73rem; color: #9ca3af; margin-bottom: 6px; }

        .strata-img-wrap { position: relative; width: 100%; margin: 8px 0; border-radius: 6px; overflow: hidden; background: #0f1115; }
        .strata-img { width: 100%; max-height: 220px; object-fit: cover; display: block; cursor: pointer; transition: transform 0.2s; }
        .strata-img:hover { transform: scale(1.02); }

        .strata-desc { font-size: 0.82rem; color: #d1d5db; line-height: 1.4; margin-bottom: 8px; }

        /* 카드 수정 및 삭제 버튼 패널 */
        .card-actions { display: flex; justify-content: flex-end; gap: 6px; border-top: 1px solid #2a303c; padding-top: 8px; }
        .act-btn {
            background: none; border: 1px solid #374151; color: #9ca3af; padding: 3px 8px;
            border-radius: 4px; font-size: 0.7rem; cursor: pointer; transition: all 0.2s;
        }
        .act-btn:hover { background: #374151; color: #fff; }
        .act-btn.del:hover { background: #ef4444; color: #fff; border-color: #ef4444; }

        .empty-state { text-align: center; padding: 30px 10px; color: #6b7280; font-size: 0.85rem; }

        /* 이미지 모달 */
        #img-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.85); z-index: 1000; align-items: center; justify-content: center; padding: 20px;
        }
        #modal-img { max-width: 95%; max-height: 85vh; border-radius: 8px; border: 1px solid #3b82f6; }
        #modal-close { position: absolute; top: 20px; right: 25px; color: #fff; font-size: 2rem; cursor: pointer; }

        @media (min-width: 768px) {
            #main-container { flex-direction: row; }
            #view-section { height: 100%; flex: 1; border-bottom: none; border-right: 2px solid #2d323e; }
            #strata-panel { width: 420px; flex: none; }
        }
    </style>
</head>
<body>

<header>
    <div class="logo">
        <i class="fa-solid fa-layer-group"></i>
        <span>광명시 시간의 지층</span>
    </div>
</header>

<div id="main-container">
    <div id="view-section">
        <div class="view-toggle">
            <button class="toggle-btn active" id="btn-map" onclick="switchView('map')">🗺 지도</button>
            <button class="toggle-btn" id="btn-rv" onclick="switchView('rv')">📷 현재 로드뷰</button>
        </div>
        <div id="map"></div>
        <div id="roadview-container"></div>
    </div>

    <div id="strata-panel">
        <div class="panel-header">
            <h2 id="loc-title"><i class="fa-solid fa-clock-rotate-left" style="color:#f59e0b;"></i> 광명 행정동별 시간 지층</h2>
            <p id="loc-desc">사진 EXIF 정보(GPS/날짜)를 통해 광명시 동별 구역에 자동으로 아카이브됩니다.</p>
        </div>

        <!-- 광명시 주요 행정동 필터 -->
        <div class="category-filter" id="dong-filter-bar">
            <button class="cat-btn active" onclick="filterDong('ALL', this)">전체 동 보기</button>
            <button class="cat-btn" onclick="filterDong('철산동', this)">철산동</button>
            <button class="cat-btn" onclick="filterDong('하안동', this)">하안동</button>
            <button class="cat-btn" onclick="filterDong('소하동', this)">소하동</button>
            <button class="cat-btn" onclick="filterDong('광명동', this)">광명동</button>
            <button class="cat-btn" onclick="filterDong('일직동', this)">일직동</button>
            <button class="cat-btn" onclick="filterDong('학온동', this)">학온동</button>
            <button class="cat-btn" onclick="filterDong('옥길동', this)">옥길동</button>
        </div>

        <div id="selected-area-display" class="area-badge">
            <i class="fa-solid fa-location-dot"></i> <span id="current-area-name">전체 광명시 지층</span>
        </div>

        <button class="upload-btn" onclick="document.getElementById('file-input').click()">
            <i class="fa-solid fa-camera"></i> 내 과거 사진 올리기 (자동 구역 인식)
        </button>
        <input type="file" id="file-input" accept="image/*" style="display:none;" onchange="handlePhotoSeedUpload(event)">

        <div class="strata-timeline" id="strata-list"></div>
    </div>
</div>

<div id="img-modal" onclick="closeModal()">
    <span id="modal-close">&times;</span>
    <img id="modal-img" src="">
</div>

<!-- 카카오맵 SDK (services 라이브러리 포함) -->
<script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=Bd83a6ca29e1fbf4fa5da49d88125054&libraries=services"></script>

<script>
    let map, geocoder, roadview, roadviewClient, currentMarker = null;
    let markersOnMap = [];
    let selectedDong = 'ALL';
    let currentLatLng = null;
    const GM_CENTER = { lat: 37.4786, lng: 126.8645 }; // 광명시청 인근

    const STORAGE_KEY = 'GM_STRATA_DONG_SEEDS_V6';

    // 광명시 기본 예시 데이터
    const initialSampleData = [
        {
            id: 1,
            dong: "철산동",
            year: "1998년",
            photoDate: "1998-05-10",
            desc: "철산주공 13단지 인근 과거 아파트 단지 풍경입니다.",
            img: "https://images.unsplash.com/photo-1542601906990-b4d3fb778b09?w=600&auto=format&fit=crop&q=60",
            lat: 37.4795,
            lng: 126.8650
        },
        {
            id: 2,
            dong: "하안동",
            year: "2002년",
            photoDate: "2002-06-18",
            desc: "하안주공 단지 및 단독필지 거리 모습입니다.",
            img: "https://images.unsplash.com/photo-1512917774080-9991f1c4c750?w=600&auto=format&fit=crop&q=60",
            lat: 37.4620,
            lng: 126.8680
        },
        {
            id: 3,
            dong: "광명동",
            year: "2008년",
            photoDate: "2008-03-15",
            desc: "광명사거리역 전통시장 정문 거리의 활기찬 옛 사진입니다.",
            img: "https://images.unsplash.com/photo-1448630360428-65456885c650?w=600&auto=format&fit=crop&q=60",
            lat: 37.4790,
            lng: 126.8548
        }
    ];

    let userStrataStore = JSON.parse(localStorage.getItem(STORAGE_KEY)) || initialSampleData;

    function saveUserSeeds() {
        try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(userStrataStore));
        } catch (e) {
            console.warn("로컬 스토리지 용량 제한:", e);
        }
    }

    function initMap() {
        const container = document.getElementById('map');
        map = new kakao.maps.Map(container, {
            center: new kakao.maps.LatLng(GM_CENTER.lat, GM_CENTER.lng),
            level: 4
        });

        geocoder = new kakao.maps.services.Geocoder();
        const rvContainer = document.getElementById('roadview-container');
        roadview = new kakao.maps.Roadview(rvContainer);
        roadviewClient = new kakao.maps.RoadviewClient();

        kakao.maps.event.addListener(map, 'click', function(mouseEvent) {
            const latLng = mouseEvent.getLatLng();
            loadRoadviewAndPos(latLng.getLat(), latLng.getLng());
        });

        loadRoadviewAndPos(GM_CENTER.lat, GM_CENTER.lng);
        updateMapMarkers();
    }

    function switchView(mode) {
        const mapEl = document.getElementById('map');
        const rvEl = document.getElementById('roadview-container');
        const btnMap = document.getElementById('btn-map');
        const btnRv = document.getElementById('btn-rv');

        if (mode === 'map') {
            mapEl.style.display = 'block'; rvEl.style.display = 'none';
            btnMap.classList.add('active'); btnRv.classList.remove('active');
        } else {
            mapEl.style.display = 'none'; rvEl.style.display = 'block';
            btnRv.classList.add('active'); btnMap.classList.remove('active');
            roadview.relayout();
        }
    }

    function filterDong(dong, el) {
        selectedDong = dong;
        document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
        if (el) el.classList.add('active');
        
        document.getElementById('current-area-name').innerText = (dong === 'ALL') ? "전체 광명시 지층" : `📍 ${dong} 지층`;
        renderStrataTimeline();
    }

    function loadRoadviewAndPos(lat, lng) {
        currentLatLng = new kakao.maps.LatLng(lat, lng);
        map.panTo(currentLatLng);

        if (currentMarker) currentMarker.setMap(null);
        currentMarker = new kakao.maps.Marker({ position: currentLatLng, map: map });

        roadviewClient.getNearestPanoId(currentLatLng, 50, function(panoId) {
            if (panoId) roadview.setPanoId(panoId, currentLatLng);
        });
    }

    function updateMapMarkers() {
        // 기존 마커 전체 제거
        markersOnMap.forEach(m => m.setMap(null));
        markersOnMap = [];

        userStrataStore.forEach(item => {
            const marker = new kakao.maps.Marker({
                position: new kakao.maps.LatLng(item.lat, item.lng),
                map: map,
                title: `${item.dong} (${item.year})`
            });

            kakao.maps.event.addListener(marker, 'click', function() {
                loadRoadviewAndPos(item.lat, item.lng);
                filterDong(item.dong, null);
                switchView('rv');
            });

            markersOnMap.push(marker);
        });
    }

    // EXIF GPS 도/분/초 -> 십진수 변환
    function convertDMSToDD(dms, ref) {
        if (!dms) return null;
        let dd = dms[0] + (dms[1] / 60) + (dms[2] / 3600);
        if (ref === "S" || ref === "W") dd = dd * -1;
        return dd;
    }

    // 좌표 -> 광명시 행정동(동) 이름 추출
    function getDongFromCoords(lat, lng, callback) {
        geocoder.coord2RegionCode(lng, lat, function(result, status) {
            if (status === kakao.maps.services.Status.OK) {
                for (let i = 0; i < result.length; i++) {
                    if (result[i].region_type === 'H') {
                        let dongName = result[i].region_3depth_name;
                        let cleanDong = dongName.replace(/[0-9]/g, '');
                        callback(cleanDong, dongName);
                        return;
                    }
                }
            }
            callback("광명동", "광명동");
        });
    }

    function handlePhotoSeedUpload(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            const imgDataUrl = e.target.result;

            EXIF.getData(file, function() {
                let photoDateStr = EXIF.getTag(this, "DateTimeOriginal") || EXIF.getTag(this, "DateTime");
                let formattedDate = "";
                let extractedYear = "";

                if (photoDateStr) {
                    const parts = photoDateStr.split(" ")[0].split(":");
                    if (parts.length === 3) {
                        extractedYear = `${parts[0]}년`;
                        formattedDate = `${parts[0]}-${parts[1]}-${parts[2]}`;
                    }
                }

                if (!formattedDate) {
                    const today = new Date();
                    formattedDate = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
                    extractedYear = `${today.getFullYear()}년`;
                }

                const latDMS = EXIF.getTag(this, "GPSLatitude");
                const latRef = EXIF.getTag(this, "GPSLatitudeRef");
                const lngDMS = EXIF.getTag(this, "GPSLongitude");
                const lngRef = EXIF.getTag(this, "GPSLongitudeRef");

                let lat = currentLatLng ? currentLatLng.getLat() : GM_CENTER.lat;
                let lng = currentLatLng ? currentLatLng.getLng() : GM_CENTER.lng;

                if (latDMS && lngDMS) {
                    lat = convertDMSToDD(latDMS, latRef);
                    lng = convertDMSToDD(lngDMS, lngRef);
                }

                getDongFromCoords(lat, lng, function(cleanDong, fullDongName) {
                    const userYear = prompt(`사진 촬영 연도를 확인해 주세요:`, extractedYear) || extractedYear;
                    const userDong = prompt(`사진이 위치한 광명시 '동' 구역입니다:`, cleanDong) || cleanDong;
                    const desc = prompt("사진과 장소에 관한 기억/추억 메모를 남겨주세요:") || `${fullDongName} 인근에서 기록된 시공간 지층입니다.`;

                    const newSeed = {
                        id: Date.now(),
                        dong: userDong,
                        year: userYear,
                        photoDate: formattedDate,
                        desc: desc,
                        img: imgDataUrl,
                        lat: lat,
                        lng: lng
                    };

                    userStrataStore.unshift(newSeed);
                    saveUserSeeds();
                    updateMapMarkers();
                    loadRoadviewAndPos(lat, lng);
                    filterDong(userDong, null);
                    alert(`사진이 [광명시 ${userDong}] 지층 아카이브에 성공적으로 편입되었습니다!`);
                });
            });
        };
        reader.readAsDataURL(file);
    }

    // 카드 내용 수정 기능
    function editCard(id) {
        const item = userStrataStore.find(seed => seed.id === id);
        if (!item) return;

        const newYear = prompt("연도를 수정합니다:", item.year) || item.year;
        const newDong = prompt("동 구역을 수정합니다 (예: 철산동, 하안동):", item.dong) || item.dong;
        const newDate = prompt("촬영 날짜를 수정합니다 (YYYY-MM-DD):", item.photoDate) || item.photoDate;
        const newDesc = prompt("설명 메모를 수정합니다:", item.desc) || item.desc;

        item.year = newYear;
        item.dong = newDong;
        item.photoDate = newDate;
        item.desc = newDesc;

        saveUserSeeds();
        updateMapMarkers();
        renderStrataTimeline();
    }

    // 카드 삭제 기능
    function deleteCard(id) {
        if (!confirm("이 지층 사진 기록을 정말 삭제하시겠습니까?")) return;

        userStrataStore = userStrataStore.filter(seed => seed.id !== id);
        saveUserSeeds();
        updateMapMarkers();
        renderStrataTimeline();
    }

    function renderStrataTimeline() {
        const list = document.getElementById('strata-list');
        list.innerHTML = '';

        let itemsToDisplay = userStrataStore;

        if (selectedDong !== 'ALL') {
            itemsToDisplay = itemsToDisplay.filter(item => item.dong.includes(selectedDong));
        }

        if (itemsToDisplay.length === 0) {
            list.innerHTML = '<div class="empty-state">해당 동 구역에 쌓인 과거 사진 지층이 없습니다.<br>첫 번째 사진을 올려 동의 옛 모습을 남겨보세요!</div>';
            return;
        }

        itemsToDisplay.forEach(item => {
            const card = document.createElement('div');
            card.className = "strata-card";

            card.innerHTML = `
                <div class="strata-node"></div>
                <div class="strata-header">
                    <span class="strata-year"><i class="fa-solid fa-clock"></i> ${item.year}</span>
                    <span class="dong-tag" onclick="filterDong('${item.dong}', null)">📍 ${item.dong}</span>
                </div>
                <div class="strata-date">📸 촬영일: ${item.photoDate}</div>
                <div class="strata-img-wrap">
                    <img class="strata-img" src="${item.img}" onclick="openModal('${item.img}')" title="클릭하여 크게 보기">
                </div>
                <div class="strata-desc">${item.desc}</div>
                <div class="card-actions">
                    <button class="act-btn" onclick="editCard(${item.id})"><i class="fa-solid fa-pen"></i> 수정</button>
                    <button class="act-btn del" onclick="deleteCard(${item.id})"><i class="fa-solid fa-trash"></i> 삭제</button>
                </div>
            `;
            list.appendChild(card);
        });
    }

    function openModal(imgSrc) {
        document.getElementById('modal-img').src = imgSrc;
        document.getElementById('img-modal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('img-modal').style.display = 'none';
    }

    window.onload = function() {
        if (typeof kakao !== 'undefined' && kakao.maps) {
            initMap();
        } else {
            document.getElementById('map').innerHTML = '<div style="padding:20px; color:#ef4444; font-size:0.85rem;">카카오 API 키 또는 도메인 설정을 확인해 주세요.</div>';
        }
    };
</script>
