<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>광명시 시간의 지층 (Gwangmyeong Time Strata)</title>
    <!-- Pretendard 폰트 & FontAwesome 아이콘 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; }
        body { background-color: #0f1117; color: #f3f4f6; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        /* 상단 헤더 */
        header {
            height: 56px;
            background: #181b22;
            border-bottom: 1px solid #2d323e;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 100;
        }
        .logo { font-size: 1.1rem; font-weight: 800; color: #60a5fa; display: flex; align-items: center; gap: 8px; }
        .logo i { color: #f59e0b; }
        .header-info { font-size: 0.85rem; color: #9ca3af; }

        /* 메인 컨테이너 */
        #main-container { display: flex; flex: 1; height: calc(100vh - 56px); position: relative; }

        /* 좌측: 카카오 지도 영역 */
        #map-section { flex: 1; height: 100%; position: relative; }
        #map { width: 100%; height: 100%; }

        /* 우측: 시간의 지층 아카이브 패널 */
        #strata-panel {
            width: 400px;
            background: #14171d;
            border-left: 1px solid #2d323e;
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow-y: auto;
            z-index: 10;
        }

        .panel-header { margin-bottom: 16px; border-bottom: 1px solid #2d323e; padding-bottom: 12px; }
        .panel-header h2 { font-size: 1.15rem; color: #fff; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
        .panel-header p { font-size: 0.82rem; color: #8b949e; line-height: 1.4; }

        /* 로드뷰 뷰어 영역 */
        #roadview-container {
            width: 100%;
            height: 220px;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #2d323e;
            margin-bottom: 16px;
            background: #000;
            position: relative;
        }

        /* 지층 추가 버튼 */
        .upload-btn {
            background: #2563eb;
            color: white;
            padding: 11px;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.2s;
        }
        .upload-btn:hover { background: #1d4ed8; }

        /* 지층 타임라인 (아래로 갈수록 오래된 과거) */
        .strata-timeline { display: flex; flex-direction: column; gap: 14px; position: relative; }
        .strata-timeline::before {
            content: ''; position: absolute; left: 15px; top: 10px; bottom: 10px;
            width: 2px; background: #2d323e; z-index: 1;
        }

        .strata-card {
            position: relative; z-index: 2; background: #1c212b; border: 1px solid #2d323e;
            border-radius: 10px; padding: 12px 12px 12px 36px; transition: border-color 0.2s;
        }
        .strata-card:hover { border-color: #3b82f6; }
        
        .strata-node {
            position: absolute; left: 10px; top: 16px; width: 12px; height: 12px;
            border-radius: 50%; background: #3b82f6; border: 2px solid #14171d; z-index: 3;
        }
        .strata-card.past .strata-node { background: #f59e0b; }

        .strata-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .strata-year { font-size: 0.95rem; font-weight: 700; color: #60a5fa; }
        .strata-card.past .strata-year { color: #f59e0b; }
        .strata-tag { font-size: 0.72rem; padding: 2px 6px; border-radius: 4px; background: #2d323e; color: #9ca3af; }

        .strata-desc { font-size: 0.85rem; color: #d1d5db; line-height: 1.4; margin-top: 4px; }
    </style>
</head>
<body>

<header>
    <div class="logo">
        <i class="fa-solid fa-layer-group"></i>
        <span>광명시 시간의 지층 아카이브</span>
    </div>
    <div class="header-info">
        📍 광명시 전용 도시 시공간 기록 시스템
    </div>
</header>

<div id="main-container">
    <!-- 지도 영역 -->
    <div id="map-section">
        <div id="map"></div>
    </div>

    <!-- 우측 지층 아카이브 패널 -->
    <div id="strata-panel">
        <div class="panel-header">
            <h2 id="loc-title"><i class="fa-solid fa-location-dot" style="color:#ef4444;"></i> 광명사거리역 주변</h2>
            <p id="loc-desc">지도의 원하는 위치를 클릭하면 해당 장소의 로드뷰와 과거 지층 데이터가 조회됩니다.</p>
        </div>

        <!-- 파노라마 로드뷰 뷰어 -->
        <div id="roadview-container"></div>

        <button class="upload-btn" onclick="document.getElementById('file-input').click()">
            <i class="fa-solid fa-plus"></i> 이 장소에 옛 사진 지층 기여하기
        </button>
        <input type="file" id="file-input" accept="image/*" style="display:none;" onchange="uploadUserPhoto(event)">

        <!-- 수직 지층 스택 -->
        <div class="strata-timeline" id="strata-list">
            <!-- 자바스크립트로 동적 생성됩니다 -->
        </div>
    </div>
</div>

<!-- 카카오맵 API 연동 (본인의 JavaScript API 키를 입력하세요) -->
<script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=bd83a6ca29e1fbf4fa5da49d88125054&libraries=services"></script>

<script>
    let map, roadview, roadviewClient;

    // 광명시 중심 좌표 (광명시청 부근)
    const GM_CENTER = { lat: 37.4786, lng: 126.8645 };

    function initMap() {
        const container = document.getElementById('map');
        const options = {
            center: new kakao.maps.LatLng(GM_CENTER.lat, GM_CENTER.lng),
            level: 4
        };

        map = new kakao.maps.Map(container, options);

        // 지도 이동 범위 제한 (광명시 영역)
        const sw = new kakao.maps.LatLng(37.385, 126.800);
        const ne = new kakao.maps.LatLng(37.525, 126.915);
        const bounds = new kakao.maps.LatLngBounds(sw, ne);

        kakao.maps.event.addListener(map, 'dragend', function() {
            if (!bounds.contain(map.getCenter())) {
                map.panTo(new kakao.maps.LatLng(GM_CENTER.lat, GM_CENTER.lng));
            }
        });

        // 로드뷰 객체 생성
        const rvContainer = document.getElementById('roadview-container');
        roadview = new kakao.maps.Roadview(rvContainer);
        roadviewClient = new kakao.maps.RoadviewClient();

        // 초기 로드뷰 설정
        loadRoadviewAt(GM_CENTER.lat, GM_CENTER.lng);

        // 지도 클릭 시 해당 위치의 로드뷰 및 지층 탐색
        kakao.maps.event.addListener(map, 'click', function(mouseEvent) {
            const latLng = mouseEvent.getLatLng();
            loadRoadviewAt(latLng.getLat(), latLng.getLng());
        });
    }

    // 좌표 기반 로드뷰 및 지층 로드
    function loadRoadviewAt(lat, lng) {
        const position = new kakao.maps.LatLng(lat, lng);
        
        roadviewClient.getNearestPanoId(position, 50, function(panoId) {
            if (panoId) {
                roadview.setPanoId(panoId, position);
                updateStrataInfo("선택한 위치 지층", "카카오 로드뷰 파노라마 데이터가 연결되었습니다.");
            } else {
                updateStrataInfo("로드뷰 미지원 구역", "골목길 또는 카카오 차량 미진입 구역입니다. 시민 사진 제보로 지층을 채워주세요.");
            }
        });
    }

    // 지층 데이터 업데이트
    function updateStrataInfo(title, desc) {
        document.getElementById('loc-title').innerHTML = `<i class="fa-solid fa-location-dot" style="color:#ef4444;"></i> ${title}`;
        document.getElementById('loc-desc').innerText = desc;

        // 예시 지층 스택 데이터 (위: 현재 ➔ 아래: 과거)
        const strataData = [
            { year: "2026년 (현재)", tag: "카카오 로드뷰", desc: "현재 도시 풍경 및 건물 현황" },
            { year: "2021년 지층", tag: "카카오 과거 데이터", desc: "재개발 및 도로 정비 진행 시기", isPast: true },
            { year: "2012년 지층", tag: "카카오 과거 데이터", desc: "구도심 상가 및 옛 골목 형태 보존 시기", isPast: true },
            { year: "2008년 기초 지층", tag: "최초 수집 기록", desc: "광명시 초기 로드뷰 수집 파노라마 기록", isPast: true }
        ];

        const list = document.getElementById('strata-list');
        list.innerHTML = '';

        strataData.forEach(item => {
            const card = document.createElement('div');
            card.className = `strata-card ${item.isPast ? 'past' : ''}`;
            card.innerHTML = `
                <div class="strata-node"></div>
                <div class="strata-header">
                    <span class="strata-year">${item.year}</span>
                    <span class="strata-tag">${item.tag}</span>
                </div>
                <div class="strata-desc">${item.desc}</div>
            `;
            list.appendChild(card);
        });
    }

    // 유저 사진 업로드 처리
    function uploadUserPhoto(event) {
        const file = event.target.files[0];
        if (file) {
            alert("📸 사진이 성공적으로 기여되었습니다! 검토 후 해당 위치의 지층에 반영됩니다.");
        }
    }

    // 카카오맵 SDK 로드 후 실행
    window.onload = function() {
        if (typeof kakao !== 'undefined' && kakao.maps) {
            initMap();
        } else {
            document.getElementById('map').innerHTML = '<div style="padding:20px; color:#ef4444;">카카오 지도 API 키를 확인해 주세요.</div>';
        }
    };
</script>

</body>
</html>
