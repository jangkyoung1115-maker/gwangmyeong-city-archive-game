<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>지층탐색 프로젝트</title>
    <style>
        /* 초기화 및 기본 스타일 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif;
            background-color: #f4f6f8;
            color: #333;
            overflow: hidden;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
        }

        /* 1. 상단 영역 (퀘스트, 작가 랭킹, 미술관) - 절반 크기로 슬림화 */
        .top-nav-section {
            display: flex;
            justify-content: space-around;
            align-items: center;
            background: #ffffff;
            padding: 5px 10px;
            border-bottom: 1px solid #e5e8eb;
            font-size: 12px;
            font-weight: 600;
        }

        .top-nav-item {
            cursor: pointer;
            color: #4b5563;
            transition: color 0.2s;
        }

        .top-nav-item:hover {
            color: #1d4ed8;
        }

        /* 2. 라이브 경쟁 중 영역 - 공간을 절반으로 축소 */
        .live-competition-banner {
            background: #fff5f5;
            color: #e53e3e;
            padding: 3px 10px;
            font-size: 11px;
            font-weight: bold;
            text-align: center;
            border-bottom: 1px solid #fed7d7;
            letter-spacing: -0.3px;
        }

        /* 메인 바디 레이아웃 */
        .main-body {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* 3. 지층탐색 사이드바 영역 - 너비 50% 이상 슬림하게 축소 */
        .strata-sidebar {
            width: 150px;
            background: #ffffff;
            border-right: 1px solid #e5e8eb;
            padding: 12px 8px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .menu-title {
            font-size: 13px;
            font-weight: 700;
            color: #111827;
            padding: 6px 8px;
            background: #f3f4f6;
            border-radius: 4px;
            text-align: center;
        }

        .sub-menu-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-top: 4px;
        }

        .sub-menu-item {
            font-size: 11px;
            color: #6b7280;
            padding: 5px 6px;
            border-radius: 3px;
            cursor: pointer;
        }

        .sub-menu-item:hover {
            background: #eef2f6;
            color: #111827;
        }

        /* 4. 지도와 사진 영역 - 시원하게 크게 확대 */
        .content-display-area {
            flex: 1;
            display: flex;
            gap: 12px;
            padding: 12px;
            background: #f9fafb;
            overflow: hidden;
        }

        /* 지도 영역 대폭 확대 */
        .map-container {
            flex: 2.2;
            background: #e5edff;
            border: 2px dashed #cbd5e1;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            color: #3b82f6;
            font-weight: bold;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        /* 사진 영역 대폭 확대 */
        .photo-container {
            flex: 1.5;
            background: #ffffff;
            border: 1px solid #e5e8eb;
            border-radius: 8px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        .photo-header {
            font-size: 12px;
            font-weight: bold;
            color: #374151;
        }

        .photo-viewer {
            flex: 1;
            background: #f3f4f6;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #9ca3af;
            font-size: 13px;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="app-container">

    <!-- 상단 영역: 퀘스트, 작가 랭킹, 미술관 (절반 크기 슬림화) -->
    <header class="top-nav-section">
        <div class="top-nav-item">🏆 퀘스트</div>
        <div class="top-nav-item">✍️ 작가 랭킹</div>
        <div class="top-nav-item">🏛️ 미술관</div>
    </header>

    <!-- 라이브 경쟁 중 영역 (절반 크기 슬림화) -->
    <section class="live-competition-banner">
        🔥 [LIVE] 실시간 경쟁 진행 중
    </section>

    <!-- 메인 화면 컨테이너 -->
    <div class="main-body">
        
        <!-- 지층탐색 사이드바 (너비 대폭 축소, '10년 단위' 제외 및 '지층탐색'만 표기) -->
        <nav class="strata-sidebar">
            <div class="menu-title">지층탐색</div>
            <ul class="sub-menu-list">
                <li class="sub-menu-item">· 탐색 레이어 1</li>
                <li class="sub-menu-item">· 탐색 레이어 2</li>
                <li class="sub-menu-item">· 아카이브 기록</li>
            </ul>
        </nav>

        <!-- 지도와 사진 영역 (시원하게 크게 확장) -->
        <main class="content-display-area">
            <!-- 지도 영역 -->
            <div class="map-container">
                <span>🗺️ 지도 영역 (시원하게 확대됨)</span>
            </div>

            <!-- 사진 영역 -->
            <div class="photo-container">
                <div class="photo-header">📷 기록 사진 뷰어</div>
                <div class="photo-viewer">
                    사진 갤러리 영역
                </div>
            </div>
        </main>

    </div>

</div>

</body>
</html>
