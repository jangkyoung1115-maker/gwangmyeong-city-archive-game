<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>광명시 시간의 지층 아카이브</title>
    <!-- Pretendard 폰트 & FontAwesome 아이콘 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- 사진 EXIF(GPS 메타데이터 & 촬영일) 추출 라이브러리 -->
    <script src="https://cdn.jsdelivr.net/npm/exif-js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; }
        html, body { width: 100%; height: 100%; background-color: #0f1115; color: #f3f4f6; overflow: hidden; }

        header {
            height: 50px; background: #181b22; border-bottom: 1px solid #2d323e;
            display: flex; align-items: center; justify-content: space-between; padding: 0 16px; z-index: 100;
        }
        .logo { font-size: 1rem; font-weight: 800; color: #60a5fa; display: flex; align-items: center; gap: 6px; }
        .logo i { color: #f59e0b; }

        #main-container { display: flex; flex-direction: column; height: calc(100vh - 50px); width: 100%; }

        /* 상단 지도 / 로드뷰 영역 */
        #view-section {
            height: 45vh; min-height: 250px; width: 100%; position: relative; background: #181b22;
            border-bottom: 2px solid #2d323e;
        }
        #map, #roadview-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
        #roadview-container { display: none; }

        .view-toggle {
            position: absolute; top: 12px; right: 12px; z-index: 20;
            background: rgba(24, 27, 34, 0.9); border: 1px solid #3b82f6; border-radius: 20px;
            padding: 4px; display: flex; gap: 4px;
        }
        .toggle-btn {
            background: none; border: none; color: #9ca3af; padding: 6px 12px;
            font-size: 0.75rem; font-weight: 700; border-radius: 16px; cursor: pointer;
        }
        .toggle-btn.active { background: #2563eb; color: #fff; }

        /* 하단 지층 아카이브 패널 */
        #strata-panel { flex: 1; background: #14171d; display: flex; flex-direction: column; padding: 16px; overflow-y: auto; }
        .panel-header { margin-bottom: 12px; }
        .panel-header h2 { font-size: 1.05rem; color: #fff; margin-bottom: 2px; display: flex; align-items: center; gap: 6px; }
        .panel-header p { font-size: 0.78rem; color: #8b949e; line-height: 1.3; }

        .upload-btn {
            background: #2563eb; color: white; padding: 12px; border: none; border-radius: 8px;
            font-weight: 700; font-size: 0.85rem; cursor: pointer; margin-bottom: 16px;
            display: flex; align-items: center; justify-content: center; gap: 6px;
            transition: background 0.2s;
        }
        .upload-btn:hover { background: #1d4ed8; }

        .strata-timeline { display: flex; flex-direction: column; gap: 14px; position: relative; }
        .strata-timeline::before {
            content: ''; position: absolute; left: 13px; top: 8px; bottom: 8px;
            width: 2px; background: #2d323e; z-index: 1;
        }

        /* 연도별 지층 카드 디자인 */
        .strata-card {
            position: relative; z-index: 2; background: #1c212b; border: 1px solid #2d323e;
            border-radius: 10px; padding: 12px 12px 12px 34px; cursor: pointer;
            transition: all 0.2s ease-in-out;
        }
        .strata-card:hover, .strata-card.selected {
            border-color: #3b82f6; background: #232a37; transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.15);
        }
        .strata-card.user-seed { border: 2px solid #3b82f6; background: #182232; }
        
        .strata-node {
            position: absolute; left: 8px; top: 16px; width: 10px; height: 10px;
            border-radius: 50%; background: #3b82f6; border: 2px solid #14171d; z-index: 3;
        }
        .strata-card.past .strata-node { background: #f59e0b; }

        .strata-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .strata-year { font-size: 0.9rem; font-weight: 700; color: #60a5fa; display: flex; align-items: center; gap: 6px; }
        .strata-card.past .strata-year { color: #f59e0b; }
        .strata-date { font-size: 0.75rem; color: #38bdf8; font-weight: 600; margin-bottom: 6px; display: flex; align-items: center; gap: 4px; }
        .strata-tag-group { display: flex; align-items: center; gap: 6px; }
        .strata-tag { font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; background: #2d323e; color: #9ca3af; }

        .action-btns { display: flex; gap: 4px; }
        .btn-mini {
            background: rgba(255, 255, 255, 0.1); border: none; color: #d1d5db;
            font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; cursor: pointer;
        }
        .btn-mini:hover { background: #2563eb; color: #fff; }
        .btn-mini.danger:hover { background: #ef4444; color: #fff; }

        .strata-img { width: 100%; max-height: 180px; object-fit: cover; border-radius: 6px; margin-top: 6px; margin-bottom: 6px; }
        .strata-desc { font-size: 0.8rem; color: #d1d5db; line-height: 1.35; }

        @media (min-width: 768px) {
            #main-container { flex-direction: row; }
            #view-section { height: 100%; flex: 1; border-bottom: none; border-right: 2px solid #2d323e; }
            #strata-panel { width: 380px; flex: none; }
        }
    </style>
</head>
<body>

<header>
    <div class="logo">
        <i class="fa-solid fa-layer-group"></i>
        <span>광명시 시간의 지층</span>
    </div>
</header>

<div id="main-container">
    <div id="view-section">
        <div class="view-toggle">
            <button class="toggle-btn active" id="btn-map" onclick="switchView('map')">🗺️ 지도</button>
            <button class="toggle-btn" id="btn-rv" onclick="switchView('rv')">📷 로드뷰</button>
        </div>
        <div id="map"></div>
        <div id="roadview-container"></div>
    </div>

    <div id="strata-panel">
        <div class="panel-header">
            <h2 id="loc-title"><i class="fa-solid fa-location-dot" style="color:#ef4444;"></i> 광명시 시공간 지층</h2>
            <p id="loc-desc">연도별 지층 카드를 누르면 해당 연도의 시공간 아카이브 데이터로 연동됩니다.</p>
        </div>

        <button class="upload-btn" onclick="document.getElementById('file-input').click()">
            <i class="fa-solid fa-camera"></i> 내 사진 업로드하여 지층 생성
        </button>
        <input type="file" id="file-input" accept="image/*" style="display:none;" onchange="handlePhotoSeedUpload(event)">

        <div class="strata-timeline" id="strata-list"></div>
    </div>
</div>

<!-- 카카오맵 SDK -->
<script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=Bd83a6ca29e1fbf4fa5da49d88125054&libraries=services"></script>

<script>
    let map, roadview, roadviewClient, currentMarker = null;
    let currentLatLng = null;
    const GM_CENTER = { lat: 37.4786, lng: 126.8645 };

    // 로컬 스토리지에 데이터 영구 보존
    const STORAGE_KEY = 'GM_STRATA_USER_SEEDS';
    let userStrataStore = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');

    function saveUserSeeds() {
        try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(userStrataStore));
        } catch (e) {
            console.warn("로컬스토리지 저장 용량 초과 가능성:", e);
        }
    }

    function initMap() {
        const container = document.getElementById('map');
        map = new kakao.maps.Map(container, {
            center: new kakao.maps.LatLng(GM_CENTER.lat, GM_CENTER.lng),
            level: 3
        });

        const rvContainer = document.getElementById('roadview-container');
        roadview = new kakao.maps.Roadview(rvContainer);
        roadviewClient = new kakao.maps.RoadviewClient();

        roadview.setTimeLine(true);

        kakao.maps.event.addListener(map, 'click', function(mouseEvent) {
            const latLng = mouseEvent.getLatLng();
            loadLocationStrata(latLng.getLat(), latLng.getLng());
        });

        loadLocationStrata(GM_CENTER.lat, GM_CENTER.lng);
    }

    function switchView(mode) {
        const mapEl = document.getElementById('map');
        const rvEl = document.getElementById('roadview-container');
        const btnMap = document.getElementById('btn-map');
        const btnRv = document.getElementById('btn-rv');

        if (mode === 'map') {
            mapEl.style.display = 'block'; rvEl.style.display = 'none';
            btnMap.classList.add('active'); btnRv.classList.remove('active');
        } else {
            mapEl.style.display = 'none'; rvEl.style.display = 'block';
            btnRv.classList.add('active'); btnMap.classList.remove('active');
            roadview.relayout();
        }
    }

    function handlePhotoSeedUpload(event) {
        const file = event.target.files[0];
        if (!file) return;

        const pwd = prompt("사진 수정/삭제용 비밀번호 4자리를 입력하세요:");
        if (!pwd) return;

        const desc = prompt("이 장소에 관한 메모/이야기를 입력하세요:") || "시민이 기록한 광명시 시공간 지층입니다.";

        const reader = new FileReader();
        reader.onload = function(e) {
            const imgDataUrl = e.target.result;

            EXIF.getData(file, function() {
                // 1. 촬영 날짜 추출 (없으면 오늘 날짜 사용)
                let photoDateStr = EXIF.getTag(this, "DateTimeOriginal") || EXIF.getTag(this, "DateTime");
                let formattedDate = "";

                if (photoDateStr) {
                    const parts = photoDateStr.split(" ")[0].split(":");
                    if (parts.length === 3) {
                        formattedDate = `${parts[0]}-${parts[1]}-${parts[2]}`;
                    }
                }

                if (!formattedDate) {
                    const today = new Date();
                    const y = today.getFullYear();
                    const m = String(today.getMonth() + 1).padStart(2, '0');
                    const d = String(today.getDate()).padStart(2, '0');
                    formattedDate = `${y}-${m}-${d} (업로드일)`;
                }

                // 2. GPS 좌표 추출
                const lat = EXIF.getTag(this, "GPSLatitude");
                const lon = EXIF.getTag(this, "GPSLongitude");

                let coords = { lat: currentLatLng ? currentLatLng.getLat() : GM_CENTER.lat, lng: currentLatLng ? currentLatLng.getLng() : GM_CENTER.lng };

                if (lat && lon) {
                    const latRef = EXIF.getTag(this, "GPSLatitudeRef") || "N";
                    const lonRef = EXIF.getTag(this, "GPSLongitudeRef") || "E";
                    coords.lat = (lat[0] + lat[1]/60 + lat[2]/3600) * (latRef === "N" ? 1 : -1);
                    coords.lng = (lon[0] + lon[1]/60 + lon[2]/3600) * (lonRef === "E" ? 1 : -1);
                }

                const newSeed = {
                    id: Date.now(),
                    pwd: pwd,
                    img: imgDataUrl,
                    desc: desc,
                    year: "시민 제보 지층",
                    photoDate: formattedDate,
                    lat: coords.lat,
                    lng: coords.lng
                };

                userStrataStore.unshift(newSeed);
                saveUserSeeds(); // 브라우저에 축적 저장
                loadLocationStrata(coords.lat, coords.lng);
            });
        };
        reader.readAsDataURL(file);
    }

    function loadLocationStrata(lat, lng) {
        currentLatLng = new kakao.maps.LatLng(lat, lng);
        map.panTo(currentLatLng);

        if (currentMarker) currentMarker.setMap(null);
        currentMarker = new kakao.maps.Marker({ position: currentLatLng, map: map });

        roadviewClient.getNearestPanoId(currentLatLng, 50, function(panoId) {
            if (panoId) {
                roadview.setPanoId(panoId, currentLatLng);
            }
            renderStrataStack();
        });
    }

    function selectYearLayer(year, lat, lng) {
        if (lat && lng) {
            loadLocationStrata(lat, lng);
        }
        switchView('rv');
    }

    function renderStrataStack() {
        const list = document.getElementById('strata-list');
        list.innerHTML = '';

        // 1. 유저 업로드 제보 지층
        userStrataStore.forEach(item => {
            const card = document.createElement('div');
            card.className = "strata-card user-seed";
            card.onclick = (e) => {
                if (e.target.tagName !== 'BUTTON') {
                    selectYearLayer(item.year, item.lat, item.lng);
                }
            };

            card.innerHTML = `
                <div class="strata-node"></div>
                <div class="strata-header">
                    <span class="strata-year"><i class="fa-solid fa-camera"></i> ${item.year}</span>
                    <div class="strata-tag-group">
                        <span class="strata-tag">시민 아카이브</span>
                        <div class="action-btns">
                            <button class="btn-mini" onclick="editUserSeed(${item.id})">수정</button>
                            <button class="btn-mini danger" onclick="deleteUserSeed(${item.id})">삭제</button>
                        </div>
                    </div>
                </div>
                <div class="strata-date"><i class="fa-regular fa-calendar-check"></i> 📸 촬영일: ${item.photoDate}</div>
                <img class="strata-img" src="${item.img}">
                <div class="strata-desc">${item.desc}</div>
            `;
            list.appendChild(card);
        });

        // 2. 연도별 기초 시공간 지층 (2026, 2021, 2012, 2008)
        const baseLayers = [
            { year: "2026년 (현재 지층)", tag: "최신 파노라마", desc: "현재 도심 풍경 및 도로/건물 상태 데이터입니다.", isPast: false },
            { year: "2021년 지층", tag: "카카오 아카이브", desc: "주변 재개발 및 광명 구도심 정비 진행 시기 데이터입니다.", isPast: true },
            { year: "2012년 지층", tag: "카카오 아카이브", desc: "옛 구도심 골목 상권 및 지형 보존 시기 데이터입니다.", isPast: true },
            { year: "2008년 기초 지층", tag: "최초 파노라마", desc: "광명시 최초 로드뷰 수집 파노라마 기록 지층입니다.", isPast: true }
        ];

        baseLayers.forEach(item => {
            const card = document.createElement('div');
            card.className = `strata-card ${item.isPast ? 'past' : ''}`;
            card.onclick = () => selectYearLayer(item.year);

            card.innerHTML = `
                <div class="strata-node"></div>
                <div class="strata-header">
                    <span class="strata-year"><i class="fa-solid fa-clock-rotate-left"></i> ${item.year}</span>
                    <span class="strata-tag">${item.tag}</span>
                </div>
                <div class="strata-desc">${item.desc}</div>
            `;
            list.appendChild(card);
        });
    }

    function editUserSeed(id) {
        const target = userStrataStore.find(item => item.id === id);
        if (!target) return;

        const inputPwd = prompt("등록하셨던 비밀번호를 입력해주세요:");
        if (inputPwd === target.pwd) {
            const newDesc = prompt("수정할 메모 내용:", target.desc);
            if (newDesc !== null) {
                target.desc = newDesc;
                saveUserSeeds();
                renderStrataStack();
                alert("수정이 완료되었습니다.");
            }
        } else {
            alert("비밀번호가 일치하지 않습니다.");
        }
    }

    function deleteUserSeed(id) {
        const targetIndex = userStrataStore.findIndex(item => item.id === id);
        if (targetIndex === -1) return;

        const inputPwd = prompt("삭제 비밀번호를 입력하세요:");
        if (inputPwd === userStrataStore[targetIndex].pwd) {
            if (confirm("정말 이 지층 기록을 삭제하시겠습니까?")) {
                userStrataStore.splice(targetIndex, 1);
                saveUserSeeds();
                renderStrataStack();
                alert("성공적으로 삭제되었습니다.");
            }
        } else {
            alert("비밀번호가 일치하지 않습니다.");
        }
    }

    window.onload = function() {
        if (typeof kakao !== 'undefined' && kakao.maps) {
            initMap();
        } else {
            document.getElementById('map').innerHTML = '<div style="padding:20px; color:#ef4444; font-size:0.85rem;">카카오 도메인(https://jangkyoung1115-maker.github.io) 설정 또는 API 키를 확인해 주세요.</div>';
        }
    };
</script>

</body>
</html>
